name: Publish production images

on:
  push:
    tags:
      - "20??.??.??-*"

permissions:
  contents: read
  packages: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - id: release
        name: Validate immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          release=${GITHUB_REF_NAME}
          if [[ ! "${release}" =~ ^([0-9]{4})\.([0-9]{2})\.([0-9]{2})-([1-9][0-9]?)$ ]]; then
            echo "release tag must use YYYY.MM.DD-N" >&2
            exit 1
          fi
          release_date="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]}"
          if [[ "$(date --date "${release_date}" +%Y-%m-%d)" != "${release_date}" ]]; then
            echo "release tag contains an invalid date" >&2
            exit 1
          fi
          echo "release=${release}" >> "${GITHUB_OUTPUT}"

  publish:
    needs: validate-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [server, web]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/anstosa/weather-${{ matrix.target }}:${{ needs.validate-release.outputs.release }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Verify published ARM64 manifest
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/anstosa/weather-${{ matrix.target }}:${{ needs.validate-release.outputs.release }}"
          docker buildx imagetools inspect "${image}" | tee "${RUNNER_TEMP}/${{ matrix.target }}-manifest.txt"
          grep -Eq 'linux/arm64|Platform:[[:space:]]+linux/arm64' "${RUNNER_TEMP}/${{ matrix.target }}-manifest.txt"

  dependency-manifests:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify pinned PostgreSQL and connector ARM64 manifests
        shell: bash
        run: |
          set -euo pipefail
          for image in postgres:17.10-bookworm cloudflare/cloudflared:2026.7.2; do
            docker buildx imagetools inspect "${image}" | tee manifest.txt
            grep -Eq 'linux/arm64|Platform:[[:space:]]+linux/arm64' manifest.txt
          done
          docker run --rm --platform linux/arm64 postgres:17.10-bookworm \
            postgres --version | grep -E 'PostgreSQL 1[7-9]|PostgreSQL [2-9][0-9]'
