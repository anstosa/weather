name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Install deployment validators
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Run deterministic repository checks
        run: npm run check
      - name: Run PostgreSQL integration gates
        run: npm run test:integration
      - name: Run browser end-to-end gates
        run: npm run test:e2e
      - name: Run deployment gates
        env:
          WEATHER_RUN_DEPLOY_INTEGRATION: "1"
        run: npm run test:deploy
      - name: Verify static deployment contracts
        run: deploy/scripts/verify-static.sh
      - name: Build production image targets
        run: |
          docker build --target server --tag weather-server:check .
          docker build --target web --tag weather-web:check .
