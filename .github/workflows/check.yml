name: Check

on:
  pull_request:
  push:
    branches:
      - '**'
  schedule:
    - cron: '19 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  change-selection:
    runs-on: ubuntu-latest
    outputs:
      deploy_integration: ${{ steps.changes.outputs.deploy_integration }}
      full_browser: ${{ steps.changes.outputs.full_browser }}
      full_tests: ${{ steps.changes.outputs.full_tests }}
      integration: ${{ steps.changes.outputs.integration }}
      native_android: ${{ steps.changes.outputs.native_android }}
      native_ios: ${{ steps.changes.outputs.native_ios }}
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@v4
        with:
          # retain the merge base and historical deployment tags
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: baseline
        name: Resolve comparison baseline
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          baseline=${CI_PREVIOUS_SHA}
          if [[ "${CI_EVENT}" == "pull_request" ]]; then
            baseline=$(git merge-base "${baseline}" "${CI_HEAD_SHA}" || true)
          fi
          printf 'sha=%s\n' "${baseline}" >> "${GITHUB_OUTPUT}"
      - id: trusted-baseline
        name: Check exact baseline validation
        if: steps.baseline.outputs.sha != ''
        env:
          CI_CHECK_MODE: baseline
          CI_SHA: ${{ steps.baseline.outputs.sha }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/await-check.mjs
      - id: changes
        name: Select conservative dependent suites
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ steps.baseline.outputs.sha }}
          CI_BASE_VERIFIED: ${{ steps.trusted-baseline.outputs.baseline_verified }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-changes.mjs

  quality-gates:
    needs: change-selection
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Install deployment validators
        run: sudo apt-get update && sudo apt-get install --yes age shellcheck
      - name: Lint repository
        run: npm run lint
      - name: Verify native project structure
        run: npm run verify:mobile-static
      - name: Verify the shared native HTTPS fixture
        run: python3 mobile/scripts/native_https_fixture_test.py
      - name: Build and typecheck once
        run: npm run build
      - name: Verify the shared widget contract
        run: npm run test:mobile-shared:compiled
      - name: Run compiled unit tests
        env:
          FULL_TESTS: ${{ needs.change-selection.outputs.full_tests }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${FULL_TESTS}" == "true" ]]; then
            npm run test:compiled
          else
            npm run test:fast:compiled
          fi
      - name: Run PostgreSQL integration gates
        if: needs.change-selection.outputs.integration == 'true'
        run: npm run test:integration:compiled
      - name: Run browser gates
        env:
          FULL_BROWSER: ${{ needs.change-selection.outputs.full_browser }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${FULL_BROWSER}" == "true" ]]; then
            npm run test:e2e:compiled
          else
            npm run test:e2e:smoke:compiled
          fi
      - name: Verify static deployment contracts once
        run: deploy/scripts/verify-static.sh
      - name: Run deployment and recovery rehearsal
        if: needs.change-selection.outputs.deploy_integration == 'true'
        run: WEATHER_RUN_DEPLOY_INTEGRATION=1 node --test --test-concurrency=1 deploy/test/*.integration.test.mjs

  native-android:
    name: Native Android
    needs: change-selection
    if: needs.change-selection.outputs.native_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out exact selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          cache: gradle
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Install Android emulator runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes libpulse0
      - name: Install pinned Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platform-tools' \
            'emulator' \
            'platforms;android-36' \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            'system-images;android-36;default;x86_64'
          sudo chmod 0666 /dev/kvm
      - name: Verify wrapper and toolchain pins
        env:
          RESULTS: ${{ runner.temp }}/weather-android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RESULTS}"
          mobile/android/scripts/verify-wrapper.sh | tee "${RESULTS}/wrapper.txt"
          mobile/android/scripts/toolchain-receipt.sh | tee "${RESULTS}/toolchain.txt"
          java mobile/android/scripts/GenerateBrandAssets.java --check \
            | tee "${RESULTS}/brand-assets.txt"
      - name: Build test and lint Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          source mobile/android/scripts/android-env.sh
          mobile/android/gradlew -p mobile/android --no-daemon \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:lintRelease \
            :app:assembleRelease
      - name: Exercise the real Android HTTPS hosted shell
        env:
          RESULTS: ${{ runner.temp }}/weather-android
        shell: bash
        run: |
          set -euo pipefail
          mobile/scripts/with-native-https-fixture.sh \
            --evidence-dir "${RESULTS}/https-fixture" \
            -- mobile/android/scripts/run-hosted-shell-tests.sh \
            "${RESULTS}/android-webview"
      - name: Verify unsigned Android Release isolation
        env:
          RESULTS: ${{ runner.temp }}/weather-android
        shell: bash
        run: |
          set -euo pipefail
          source mobile/android/scripts/android-env.sh
          mobile/android/scripts/verify-release-artifact.sh | tee "${RESULTS}/release-scan.txt"
          test -f mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -f mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum \
            mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            > "${RESULTS}/apk-sha256.txt"
          test -s \
            mobile/android/app/build/outputs/androidTest-results/managedDevice/debug/widgetPhone/TEST-widgetPhone.xml
          test -s "${RESULTS}/android-webview/TEST-widgetPhone.xml"
          test -d mobile/android/app/build/reports/androidTests/managedDevice
          python3 - "${RESULTS}/android-webview/TEST-widgetPhone.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as element_tree

          receipt = element_tree.parse(sys.argv[1]).getroot()
          expected = {"errors": "0", "failures": "0", "skipped": "0", "tests": "28"}
          # require the complete real-hosted journey count
          if any(receipt.attrib.get(name) != value for name, value in expected.items()):
              raise SystemExit(f"unexpected Android hosted-shell result: {receipt.attrib}")
          PY
      - name: Retain Android build and host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: native-android-${{ github.sha }}
          path: |
            ${{ runner.temp }}/weather-android/**
            mobile/android/app/build/outputs/apk/**
            mobile/android/app/build/outputs/androidTest-results/**
            mobile/android/app/build/outputs/managed_device_android_test_additional_output/**
            mobile/android/app/build/reports/**
            mobile/android/app/build/test-results/**
          retention-days: 14

  native-ios:
    name: Native iOS
    needs: change-selection
    if: needs.change-selection.outputs.native_ios == 'true'
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out exact selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Build test and scan unsigned iOS artifacts
        env:
          RESULTS: ${{ runner.temp }}/weather-ios-build
        run: mobile/ios/scripts/build-m0.sh
      - name: Verify mandatory iOS build receipts
        env:
          RESULTS: ${{ runner.temp }}/weather-ios-build
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "source_commit=${GITHUB_SHA}" "${RESULTS}/debug-build-passed.txt"
          test "$(cat "${RESULTS}/test-status.txt")" = '0'
          grep -Fq 'release_artifact_isolation=passed' \
            "${RESULTS}/release-validation-passed.txt"
          test -s "${RESULTS}/release-receipts/release-sha256.txt"
      - name: Archive only the produced iOS app bundles
        env:
          RESULTS: ${{ runner.temp }}/weather-ios-build
        shell: bash
        run: |
          set -euo pipefail
          retained="${RESULTS}/retained-apps"
          mkdir -p "${retained}"
          # retain only the bounded simulator app products
          for configuration in Debug Release; do
            products="${RESULTS}/DerivedData/Build/Products/${configuration}-iphonesimulator"
            test -d "${products}/Weather.app"
            COPYFILE_DISABLE=1 tar -C "${products}" -cf \
              "${retained}/Weather-${configuration}-iphonesimulator.app.tar" Weather.app
          done
          (cd "${retained}" && shasum -a 256 ./*.tar > app-bundles.sha256)
      - name: Exercise the real iOS HTTPS hosted shell
        env:
          RESULTS: ${{ runner.temp }}/weather-ios-webview
        run: |
          mobile/scripts/with-native-https-fixture.sh \
            --evidence-dir "${RUNNER_TEMP}/weather-native-https-fixture" \
            -- mobile/ios/scripts/probe-webview-https.sh
      - name: Verify mandatory iOS HTTPS hosted-shell receipts
        env:
          RESULTS: ${{ runner.temp }}/weather-ios-webview
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "${RESULTS}/webview-https-status.txt")" = '0'
          grep -Fxq 'webview_https_journeys=passed' "${RESULTS}/webview-https-passed.txt"
          grep -Fxq 'trusted_tls=passed' "${RESULTS}/webview-https-passed.txt"
          grep -Fxq 'untrusted_tls_rejected=passed' "${RESULTS}/webview-https-passed.txt"
          grep -Fq 'disposable_simulator_deleted=' "${RESULTS}/simulator-cleanup.txt"
          test -s "${RESULTS}/evidence.sha256"
          test -s "${RESULTS}/webview-https-test.log"
          test -s "${RESULTS}/webview-lifecycle.log"
          test -s "${RESULTS}/attachments.sha256"
          test -d "${RESULTS}/WeatherHTTPS.xcresult"
          test -d "${RESULTS}/attachments"
          test -s "${RESULTS}/attachments/manifest.json"
          # require all four independently inspectable HTTPS journey attachments
          for attachment in \
            https-fixture-authenticated-celsius-screenshot \
            https-fixture-authenticated-celsius-webview-hierarchy \
            https-fixture-untrusted-retry-screenshot \
            https-fixture-untrusted-retry-webview-hierarchy; do
            grep -Fq "${attachment}" "${RESULTS}/attachments/manifest.json"
          done
      - name: Rescan the produced iOS Release after fixture cleanup
        env:
          RESULTS: ${{ runner.temp }}/weather-ios-build
        shell: bash
        run: |
          set -euo pipefail
          mobile/ios/scripts/verify-release-artifacts.sh \
            "${RESULTS}/DerivedData" \
            "${RESULTS}/post-https-release-receipts"
          cmp \
            "${RESULTS}/release-receipts/release-sha256.txt" \
            "${RESULTS}/post-https-release-receipts/release-sha256.txt"
      - name: Exercise the product AppIntent host lifecycle
        env:
          RESULTS: ${{ runner.temp }}/weather-ios-widget-unit
        run: mobile/ios/scripts/probe-widget-unit.sh
      - name: Verify mandatory iOS host receipts
        env:
          RESULTS: ${{ runner.temp }}/weather-ios-widget-unit
        shell: bash
        run: |
          set -euo pipefail
          test -s "${RESULTS}/widget-unit.log"
          test -s "${RESULTS}/evidence.sha256"
          test "$(cat "${RESULTS}/edit-to-celsius-status.txt")" = '0'
          test "$(cat "${RESULTS}/restart-and-return-fahrenheit-status.txt")" = '0'
      - name: Exercise extension-owned failed-attempt persistence
        env:
          RESULTS: ${{ runner.temp }}/weather-ios-widget-persistence
        run: mobile/ios/scripts/probe-widget-persistence.sh
      - name: Verify mandatory iOS persistence receipts
        env:
          RESULTS: ${{ runner.temp }}/weather-ios-widget-persistence
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "${RESULTS}/concurrency/test-status.txt")" = '0'
          test "$(cat "${RESULTS}/before-restart/test-status.txt")" = '0'
          test "$(cat "${RESULTS}/after-restart/test-status.txt")" = '0'
          grep -Fxq 'extension_owned_store=passed' \
            "${RESULTS}/persistence-probe-passed.txt"
          grep -Fxq 'matching_success_required=passed' \
            "${RESULTS}/persistence-probe-passed.txt"
          grep -Fxq 'failed_attempt_process_restart=passed' \
            "${RESULTS}/persistence-probe-passed.txt"
          grep -Fxq 'visible_spoken_offline_weather=passed' \
            "${RESULTS}/persistence-probe-passed.txt"
          grep -Fq "source_commit=${GITHUB_SHA}" "${RESULTS}/persistence-receipt.txt"
          grep -Fxq 'failure_outcome=offline' "${RESULTS}/persistence-receipt.txt"
          grep -Fxq 'phase_b_state_source=read-only' "${RESULTS}/persistence-receipt.txt"
          grep -Fq 'disposable_simulator_deleted=' "${RESULTS}/simulator-cleanup.txt"
          test -s "${RESULTS}/evidence.sha256"
          test -s "${RESULTS}/attachments.sha256"
          test -d "${RESULTS}/concurrency/WeatherPersistenceConcurrency.xcresult"
          test -d "${RESULTS}/before-restart/WeatherPersistence.xcresult"
          test -d "${RESULTS}/after-restart/WeatherPersistence.xcresult"
      - name: Exercise shared fixtures through the WidgetKit host
        env:
          RESULTS: ${{ runner.temp }}/weather-ios-semantic-host
        run: mobile/ios/scripts/probe-widget-semantic-host.sh
      - name: Verify mandatory iOS semantic host receipts
        env:
          RESULTS: ${{ runner.temp }}/weather-ios-semantic-host
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < "${RESULTS}/cases.tsv" | tr -d ' ')" = '6'
          test "$(wc -l < "${RESULTS}/semantic-host.log" | tr -d ' ')" = '6'
          grep -Fxq 'semantic_host_cases=6' "${RESULTS}/semantic-host-passed.txt"
          grep -Fxq 'semantic_host_assertions=passed' "${RESULTS}/semantic-host-passed.txt"
          grep -Fq 'independent clipping, contrast, and text-visibility review remains required' \
            "${RESULTS}/visual-review-required.txt"
          test -s "${RESULTS}/evidence.sha256"
          statuses=("${RESULTS}"/cases/*/test-status.txt)
          test "${#statuses[@]}" = '6'
          # require every isolated host case to execute successfully
          for status in "${statuses[@]}"; do
            test "$(cat "${status}")" = '0'
          done
      - name: Retain iOS build and host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: native-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/weather-ios-build/toolchain.txt
            ${{ runner.temp }}/weather-ios-build/debug-build-passed.txt
            ${{ runner.temp }}/weather-ios-build/project-list.json
            ${{ runner.temp }}/weather-ios-build/debug-build.log
            ${{ runner.temp }}/weather-ios-build/Weather.xcresult
            ${{ runner.temp }}/weather-ios-build/test-attachments/**
            ${{ runner.temp }}/weather-ios-build/test-attachments-export-status.txt
            ${{ runner.temp }}/weather-ios-build/test.log
            ${{ runner.temp }}/weather-ios-build/test-status.txt
            ${{ runner.temp }}/weather-ios-build/simulator-udid.txt
            ${{ runner.temp }}/weather-ios-build/test-app-lifecycle.log
            ${{ runner.temp }}/weather-ios-build/test-app-lifecycle-start-status.txt
            ${{ runner.temp }}/weather-ios-build/test-app-lifecycle-process-status.txt
            ${{ runner.temp }}/weather-ios-build/test-app-lifecycle-status.txt
            ${{ runner.temp }}/weather-ios-build/release-build-analyze.log
            ${{ runner.temp }}/weather-ios-build/release-validation-passed.txt
            ${{ runner.temp }}/weather-ios-build/release-receipts/**
            ${{ runner.temp }}/weather-ios-build/post-https-release-receipts/**
            ${{ runner.temp }}/weather-ios-build/retained-apps/**
            ${{ runner.temp }}/weather-ios-widget-unit/**
            !${{ runner.temp }}/weather-ios-widget-unit/DerivedData/**
            ${{ runner.temp }}/weather-ios-widget-persistence/**
            !${{ runner.temp }}/weather-ios-widget-persistence/DerivedData/**
            ${{ runner.temp }}/weather-ios-semantic-host/**
            !${{ runner.temp }}/weather-ios-semantic-host/DerivedData/**
            ${{ runner.temp }}/weather-ios-webview/**
            !${{ runner.temp }}/weather-ios-webview/DerivedData/**
            ${{ runner.temp }}/weather-native-https-fixture/**
          retention-days: 14

  check-complete:
    name: Required Check jobs
    if: always()
    needs:
      - change-selection
      - quality-gates
      - native-android
      - native-ios
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enforce selected job results
        env:
          CI_CHANGES_MODE: aggregate
          CI_CHANGE_SELECTION_RESULT: ${{ needs.change-selection.result }}
          CI_NATIVE_ANDROID: ${{ needs.change-selection.outputs.native_android }}
          CI_NATIVE_ANDROID_RESULT: ${{ needs.native-android.result }}
          CI_NATIVE_IOS: ${{ needs.change-selection.outputs.native_ios }}
          CI_NATIVE_IOS_RESULT: ${{ needs.native-ios.result }}
          CI_QUALITY_GATES_RESULT: ${{ needs.quality-gates.result }}
        run: node scripts/ci-changes.mjs
