services:
  postgres:
    image: ${WEATHER_LOCAL_POSTGRES_IMAGE:-postgres:17.10-bookworm}
    platform: ${WEATHER_LOCAL_PLATFORM:-linux/amd64}
    networks: [data, local_postgres_ingress]
    ports:
      - "127.0.0.1:${WEATHER_LOCAL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - weather_local_postgres:/var/lib/postgresql/data

  web:
    image: ${WEATHER_LOCAL_WEB_IMAGE:-weather-web:local}
    platform: ${WEATHER_LOCAL_PLATFORM:-linux/amd64}
    networks: [edge, web_api, local_web_ingress]
    build:
      platforms: ["${WEATHER_LOCAL_PLATFORM:-linux/amd64}"]
    ports:
      - "127.0.0.1:${WEATHER_LOCAL_WEB_PORT:-3000}:3000"

  cloudflared:
    platform: ${WEATHER_LOCAL_PLATFORM:-linux/amd64}
    image: node:24-bookworm-slim
    entrypoint: [node]
    command:
      - -e
      - >-
        require('node:http').createServer((_,response)=>{response.end('local tunnel disabled')}).listen(2000,'0.0.0.0')
    secrets: !reset []
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:2000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))

  migration:
    image: ${WEATHER_LOCAL_SERVER_IMAGE:-weather-server:local}
    platform: ${WEATHER_LOCAL_PLATFORM:-linux/amd64}
    build:
      platforms: ["${WEATHER_LOCAL_PLATFORM:-linux/amd64}"]

  api:
    image: ${WEATHER_LOCAL_SERVER_IMAGE:-weather-server:local}
    platform: ${WEATHER_LOCAL_PLATFORM:-linux/amd64}
    build: !reset null

  worker:
    image: ${WEATHER_LOCAL_SERVER_IMAGE:-weather-server:local}
    platform: ${WEATHER_LOCAL_PLATFORM:-linux/amd64}
    build: !reset null

networks:
  local_postgres_ingress:
    driver: bridge
  local_web_ingress:
    driver: bridge

volumes:
  weather_local_postgres:
