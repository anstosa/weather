name: weather

x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m

x-application: &application
  image: ${WEATHER_SERVER_IMAGE:-ghcr.io/anstosa/weather-server}:${WEATHER_RELEASE:?set WEATHER_RELEASE}
  build:
    context: ..
    dockerfile: Dockerfile
    target: server
    platforms: [linux/arm64]
  platform: linux/arm64
  init: true
  user: "10002:10002"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=32m,mode=1777
  logging: *bounded-logs
  stop_grace_period: 45s

x-database-environment: &database-environment
  WEATHER_DATABASE_HOST: postgres
  WEATHER_DATABASE_PORT: "5432"
  WEATHER_DATABASE_NAME: ${WEATHER_DATABASE_NAME:-weather}
  WEATHER_DATABASE_SSL: "false"
  WEATHER_DATABASE_LOCK_TIMEOUT_MS: "10000"
  WEATHER_DATABASE_STATEMENT_TIMEOUT_MS: "30000"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.10-bookworm}
    platform: linux/arm64
    restart: unless-stopped
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=0755,uid=999,gid=999
    environment:
      POSTGRES_DB: ${WEATHER_DATABASE_NAME:-weather}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/weather_owner_password
      WEATHER_OWNER_PASSWORD_FILE: /run/secrets/weather_owner_password
      WEATHER_API_PASSWORD_FILE: /run/secrets/weather_api_password
      WEATHER_INGEST_PASSWORD_FILE: /run/secrets/weather_ingest_password
    secrets:
      - source: weather_owner_password
        target: weather_owner_password
        uid: "999"
        gid: "999"
        mode: 0400
      - source: weather_api_password
        target: weather_api_password
        uid: "999"
        gid: "999"
        mode: 0400
      - source: weather_ingest_password
        target: weather_ingest_password
        uid: "999"
        gid: "999"
        mode: 0400
    volumes:
      - ${WEATHER_POSTGRES_DIR:-/var/lib/weather/postgres}:/var/lib/postgresql/data
      - ./postgres/010-create-runtime-roles.sh:/docker-entrypoint-initdb.d/010-create-runtime-roles.sh:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready --username postgres --dbname $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    pids_limit: 128
    stop_grace_period: 60s
    logging: *bounded-logs
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
          pids: 128
        reservations:
          memory: 256M

  migration:
    <<: *application
    restart: "no"
    command: [node, deploy/scripts/migrate.mjs]
    environment:
      <<: *database-environment
      WEATHER_DATABASE_APPLICATION_NAME: weather-migration
      WEATHER_DATABASE_USER: weather_owner
      WEATHER_DATABASE_PASSWORD_FILE: /run/secrets/weather_owner_password
      WEATHER_MIGRATION_DIRECTORY: /opt/weather/packages/database/migrations
    secrets:
      - source: weather_owner_password
        target: weather_owner_password
        uid: "10002"
        gid: "10002"
        mode: 0400
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 64

  api:
    <<: *application
    restart: unless-stopped
    command: [node, apps/api/dist/main.js]
    environment:
      <<: *database-environment
      WEATHER_API_PORT: "3001"
      WEATHER_DATABASE_APPLICATION_NAME: weather-api
      WEATHER_DATABASE_USER: weather_api
      WEATHER_DATABASE_PASSWORD_FILE: /run/secrets/weather_api_password
      WEATHER_VERSION: ${WEATHER_RELEASE:?set WEATHER_RELEASE}
    secrets:
      - source: weather_api_password
        target: weather_api_password
        uid: "10002"
        gid: "10002"
        mode: 0400
    networks: [web_api, data]
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/sites').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    pids_limit: 96
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 96
        reservations:
          memory: 96M

  worker:
    <<: *application
    restart: unless-stopped
    command: [node, apps/worker/dist/worker.js]
    environment:
      <<: *database-environment
      WEATHER_DATABASE_APPLICATION_NAME: weather-worker
      WEATHER_DATABASE_USER: weather_ingest
      WEATHER_DATABASE_PASSWORD_FILE: /run/secrets/weather_ingest_password
      WEATHER_SITE_CONFIG_PATH: /opt/weather/config/sites/ballydidean.json
      WEATHER_WORKER_INSTANCE: weather-worker
      WEATHER_RELEASE: ${WEATHER_RELEASE:?set WEATHER_RELEASE}
    secrets:
      - source: weather_ingest_password
        target: weather_ingest_password
        uid: "10002"
        gid: "10002"
        mode: 0400
    networks: [data, provider_egress]
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, apps/worker/dist/health.js]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    pids_limit: 96
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 96
        reservations:
          memory: 96M

  web:
    image: ${WEATHER_WEB_IMAGE:-ghcr.io/anstosa/weather-web}:${WEATHER_RELEASE:?set WEATHER_RELEASE}
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
      platforms: [linux/arm64]
    platform: linux/arm64
    restart: unless-stopped
    init: true
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [node, deploy/scripts/web-server.mjs]
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      WEATHER_API_ORIGIN: http://api:3001
      WEATHER_PUBLIC_ORIGIN: ${WEATHER_PUBLIC_ORIGIN:-https://weather.santosa.family}
      WEATHER_VERSION: ${WEATHER_RELEASE:?set WEATHER_RELEASE}
    networks: [edge, web_api]
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    pids_limit: 64
    stop_grace_period: 30s
    logging: *bounded-logs
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 64
        reservations:
          memory: 32M

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.7.2}
    platform: linux/arm64
    restart: unless-stopped
    user: "65532:65532"
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    secrets:
      - source: cloudflare_tunnel_token
        target: cloudflare_tunnel_token
        uid: "65532"
        gid: "65532"
        mode: 0400
    networks: [edge, tunnel_egress]
    depends_on:
      web:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, cloudflared, tunnel, --metrics, 127.0.0.1:2000, ready]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    stop_grace_period: 45s
    logging: *bounded-logs
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 64
        reservations:
          memory: 32M

networks:
  edge:
    driver: bridge
    internal: true
  web_api:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
  provider_egress:
    driver: bridge
  tunnel_egress:
    driver: bridge

secrets:
  weather_owner_password:
    file: ./secrets/weather_owner_password
  weather_api_password:
    file: ./secrets/weather_api_password
  weather_ingest_password:
    file: ./secrets/weather_ingest_password
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token
